services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: verus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SERVER_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - verus-sql-data:/var/opt/mssql

volumes:
  verus-sql-data: