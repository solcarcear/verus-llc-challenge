<div class="page">
  <header class="page-header">
    <h1 class="page-title">Company Management</h1>
    <p class="page-subtitle">Add and search companies</p>
  </header>

  <main class="page-layout">
    <section class="card">
      <app-company-form (created)="onCompanyCreated($event)" />
    </section>

    <section class="card">
      <h2 class="card-title">Companies</h2>

      <app-company-search
        (searchRequested)="onSearchRequested($event)"
        (clearRequested)="onClearRequested()"
      />

      @if (loading()) {
        <p class="status-message">Loading companies…</p>
      } @else if (searching()) {
        <p class="status-message">Searching…</p>
      } @else if (errorMessage(); as message) {
        <p class="status-message status-message--error" role="alert">{{ message }}</p>
      } @else {
        <app-company-list [companies]="companies()" [emptyMessage]="emptyMessage()" />
      }
    </section>
  </main>
</div>

<router-outlet />
