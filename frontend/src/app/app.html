<app-company-form (created)="onCompanyCreated($event)" />

@if (loading()) {
  <p class="load-status">Loading companies…</p>
} @else if (loadError()) {
  <p class="load-status load-error">Companies could not be loaded. Please try again later.</p>
} @else {
  <app-company-list [companies]="companies()" />
}

<router-outlet />
