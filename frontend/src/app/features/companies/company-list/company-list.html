@if (companies().length === 0) {
  <p class="empty-state">{{ emptyMessage() }}</p>
} @else {
  <ul class="company-list">
    @for (company of companies(); track company.id) {
      <li class="company-list-item">
        <div class="company-list-item-details">
          <span class="company-name">{{ company.name }}</span>
          <a [href]="company.websiteUrl" target="_blank" rel="noopener noreferrer">
            {{ company.websiteUrl }}
          </a>
        </div>
        <div class="company-list-item-actions">
          <button type="button" class="link-button" (click)="onEdit(company)">Edit</button>
          <button type="button" class="link-button link-button--danger" (click)="onDelete(company)">
            Delete
          </button>
        </div>
      </li>
    }
  </ul>
}
